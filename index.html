<!DOCTYPE html>
<html lang="en">
<head>
    <metacharset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Tracker 🌸</title>
    <style>
        :root {
            --pastel-pink: #ffd1dc;
            --pastel-purple: #e2d1f9;
            --deep-purple: #8b5cf6;
            --text-dark: #4a4063;
            --bg-color: #fdf8fa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(226, 209, 249, 0.3);
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--pastel-pink);
        }
        h2 {
            text-align: center;
            color: #6b46c1;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #6b46c1;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #f3e8ff;
            border-radius: 12px;
            font-size: 15px;
            background-color: #faf5ff;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--deep-purple);
            background-color: white;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.4);
            transition: transform 0.2s;
            margin-top: 10px;
        }
        button:active {
            transform: scale(0.98);
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 14px;
            color: #a78bfa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Pocket Tracker 💖</h2>
    <div class="subtitle">Aesthetic & Fast Expense Logger</div>
    
    <form id="expenseForm">
        <div class="form-group">
            <label>Amount (RM)</label>
            <input type="number" step="0.01" id="amount" placeholder="0.00" required>
        </div>

        <div class="form-group">
            <label>Item Name / Shop</label>
            <input type="text" id="itemName" placeholder="e.g. ZUS Coffee ☕" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select id="category">
                <option value="Food">Food 🍔</option>
                <option value="Transport">Transport 🚗</option>
                <option value="Shopping">Shopping 🛍️</option>
                <option value="Bills">Bills 💡</option>
                <option value="Rent">Rent 🏠</option>
                <option value="MARA">MARA 📚</option>
                <option value="PTPTN">PTPTN 🎓</option>
                <option value="Parents">Parents 💐</option>
                <option value="Savings">Savings 💰</option>
                <option value="Others">Others ✨</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Method</label>
            <select id="paymentMethod">
                <option value="Cash">Cash 💵</option>
                <option value="Online Banking">Online Banking 📱</option>
                <option value="e-Wallet">e-Wallet 💳</option>
                <option value="Credit/Debit Card">Credit/Debit Card 🏧</option>
            </select>
        </div>

        <div class="form-group">
            <label>Notes (Optional)</label>
            <input type="text" id="notes" placeholder="Any extra notes...">
        </div>

        <button type="submit" id="submitBtn">Save Expense ✨</button>
        <div class="loading" id="loadingText">Saving to your cute sheet... 🌸</div>
    </form>
</div>

<script>
    // MASUKKAN URL WEB APP APPS SCRIPT YOU KAT BAWAH NI:
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1akYaat-H3RSoDxjpM0hC8pjL72tYEN9b56onJECqLPysxXuPz_tPK3iZsmv5ojmf/exec";

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loadingText');
        
        btn.style.display = 'none';
        loading.style.display = 'block';

        const data = {
            amount: document.getElementById('amount').value,
            itemName: document.getElementById('itemName').value,
            category: document.getElementById('category').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            notes: document.getElementById('notes').value,
            date: new Date().toISOString().split('T')[0]
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            alert('Yay! Berjaya rekod belanja! 💖');
            document.getElementById('expenseForm').reset();
            btn.style.display = 'block';
            loading.style.display = 'none';
        })
        .catch(error => {
            alert('Eh ada ralat sikit: ' + error);
            btn.style.display = 'block';
            loading.style.display = 'none';
        });
    });
</script>

</body>
</html>
